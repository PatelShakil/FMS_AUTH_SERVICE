# ============================================
# PostgreSQL DataSource Configuration
# ============================================
datasource.url=jdbc:postgresql://localhost:3606/boloindia_dev?currentSchema=auth_service
datasource.username=boloindia
datasource.password=boloindiapass
datasource.driver=org.postgresql.Driver

# ============================================
# JWT Configuration
# ============================================
# Private key for signing tokens (auth-service only)
smallrye.jwt.sign.key.location=keys/privateKey.pem

# Public key for verification (when testing secured endpoints)
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=auth-service
smallrye.jwt.sign.key.algorithm=RS256
mp.jwt.verify.publickey.algorithm=RS256

payara.micro.disable.default.error.page=true


# Token expiry times (in seconds)
jwt.access.token.expiry=3600
jwt.refresh.token.expiry=604800

# ============================================
# Service Configuration
# ============================================
service.name=auth-service
service.version=1.0.0

# ============================================
# Kafka Configuration (NEW!)
# ============================================
kafka.bootstrap.servers=localhost:9092
kafka.producer.topic.org-registration=org.registration.requested
kafka.consumer.topic.org-created=org.created
kafka.consumer.topic.org-approved=org.approved
kafka.consumer.group.id=auth-service-group

# ============================================
# Distributor Kafka Topics
# ============================================
kafka.producer.topic.distributor-registered=distributor.registered
kafka.producer.topic.distributor-approved=distributor.approved
kafka.producer.topic.distributor-rejected=distributor.rejected
kafka.producer.topic.distributor-suspended=distributor.suspended
kafka.producer.topic.distributor-reactivated=distributor.reactivated

# User Kafka Topics
kafka.producer.topic.user-created=user.created
kafka.producer.topic.user-approved=user.approved

# ============================================
# MinIO Configuration  \u2705 NEW
# ============================================
minio.endpoint=http://localhost:9000
minio.access.key=boloindia
minio.secret.key=boloindiapass123
minio.bucket.profiles=boloindia-profiles
minio.public.url=http://localhost:9000

# ============================================
# File Upload Limits
# ============================================
upload.max.file.size=5242880
upload.allowed.extensions=jpg,jpeg,png,gif,webp

payara.microprofile.metrics.healthcheck.enabled=false
payara.microprofile.metrics.jaxrs.enabled=true
payara.microprofile.metrics.ejb.enabled=true
payara.microprofile.metrics.jdbc.enabled=false

